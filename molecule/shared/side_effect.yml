---
# 1. ADR 0011 (vagrant, firewalld running): with mariadb_client_sources not covering the Molecule host,
#    the host cannot reach 3306. The next converge restores the default sources (verify checks access).
# 2. Datadir guard: with the datadir marker present, an empty datadir (missing mount) fails deploy
#    instead of being initialized; the datadir is put back afterwards.
# 3. ADR 0009: a run interrupted after 99-tera.cnf was written must still restart next time.
# Sequence: idempotence -> side_effect (this) -> converge -> verify.

- name: Check whether firewalld runs
  hosts: mariadb
  become: true
  gather_facts: true
  tasks:
    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Remember firewalld state
      ansible.builtin.set_fact:
        _se_firewalld: >-
          {{ ((ansible_facts['services']['firewalld.service']['state'] | default('')) == 'running')
             and lookup('ansible.builtin.env', 'MOLECULE_DRIVER_NAME') == 'vagrant' }}

- name: Restrict client sources
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _se_db01: "{{ hostvars['db01']['ansible_facts']['default_ipv4']['address'] }}"
    _se_fw: "{{ hostvars['db01']['_se_firewalld'] | bool }}"
  tasks:
    # tera_manage_firewall=false: Tera must not touch firewalld at all.
    - name: Deploy restricted sources with tera_manage_firewall=false
      ansible.builtin.include_tasks: tasks/tera_run.yml
      vars:
        _se_case:
          args: [-e, '{"mariadb_client_sources": ["10.255.255.0/24"], "tera_manage_firewall": false}']
          expect_success: true
      when: _se_fw

    - name: Connect from the Molecule host (firewall untouched)
      ansible.builtin.wait_for:
        host: "{{ _se_db01 }}"
        port: 3306
        search_regex: MariaDB
        timeout: 5
      when: _se_fw

    - name: Deploy with sources that exclude the Molecule host
      ansible.builtin.include_tasks: tasks/tera_run.yml
      vars:
        _se_case:
          args: [-e, '{"mariadb_client_sources": ["10.255.255.0/24"]}']
          expect_success: true
      when: _se_fw

    - name: Connect to MariaDB from the Molecule host
      ansible.builtin.wait_for:
        host: "{{ _se_db01 }}"
        port: 3306
        timeout: 5
      register: _se_refused
      ignore_errors: true
      when: _se_fw

    - name: Assert the host is refused
      ansible.builtin.assert:
        that:
          - _se_refused is failed
      when: _se_fw

    # --check --diff back to the default sources shows the rule Tera would remove, changes nothing.
    - name: Run deploy --check --diff with the default sources
      ansible.builtin.include_tasks: tasks/tera_run.yml
      vars:
        _se_case:
          args: [--check, --diff]
          expect_success: true
      when: _se_fw

    - name: Assert the rule to remove is shown
      ansible.builtin.assert:
        that:
          - "'aturan firewalld yang akan dihapus Tera' in _se_check_out"
          - "'source address=\"10.255.255.0/24\" port port=\"3306\"' in _se_check_out"
          - "\"port zona yang ditutup tidak ada\" in _se_check_out"
      vars:
        _se_check_out: "{{ _se_run.stdout | regex_replace('\\s+', ' ') | regex_replace('\\\\', '') }}"
      when: _se_fw

    - name: Connect again after --check (still refused)
      ansible.builtin.wait_for:
        host: "{{ _se_db01 }}"
        port: 3306
        timeout: 5
      register: _se_refused_check
      ignore_errors: true
      when: _se_fw

    - name: Assert --check changed nothing
      ansible.builtin.assert:
        that:
          - _se_refused_check is failed
      when: _se_fw

- name: Empty the datadir as if its disk were not mounted
  hosts: mariadb
  become: true
  gather_facts: false
  roles:
    - role: tera_defaults
  tasks:
    - name: Stop MariaDB
      ansible.builtin.systemd_service:
        name: mariadb
        state: stopped

    - name: Move the datadir away
      ansible.builtin.command:
        cmd: mv /var/lib/mysql /var/lib/mysql.tera-test
        creates: /var/lib/mysql.tera-test

    - name: Leave an empty datadir behind
      ansible.builtin.file:
        path: /var/lib/mysql
        state: directory
        owner: mysql
        group: mysql
        mode: "0755"

- name: Deploy over the empty datadir
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run deploy
      ansible.builtin.include_tasks: tasks/tera_run.yml
      vars:
        _se_case:
          expect: "Tera tidak membuat database kosong baru. Periksa mount dan disk datadir"

- name: Put the datadir back
  hosts: mariadb
  become: true
  gather_facts: false
  tasks:
    - name: Check the empty datadir stayed empty (nothing was initialized)
      ansible.builtin.find:
        paths: /var/lib/mysql
        file_type: any
      register: _se_empty

    - name: Assert nothing was initialized
      ansible.builtin.assert:
        that:
          - _se_empty.matched == 0

    - name: Remove the empty datadir
      ansible.builtin.file:
        path: /var/lib/mysql
        state: absent

    - name: Move the datadir back
      ansible.builtin.command:
        cmd: mv /var/lib/mysql.tera-test /var/lib/mysql
        creates: /var/lib/mysql

    - name: Start MariaDB
      ansible.builtin.systemd_service:
        name: mariadb
        state: started

# Backups (ADR 0012/0013), only in scenarios with mariadb_backup_enabled (standalone-podman, also in CI):
# full, rows, incremental, disaster, local restore of the latest backup.
- name: Back up, lose and restore data
  hosts: db01
  become: true
  gather_facts: false
  tasks:
    - name: Remember whether backups are on
      ansible.builtin.set_fact:
        _se_backup: "{{ mariadb_backup_enabled | default(false) | bool }}"

    - name: Create app.bk with rows A
      ansible.builtin.command:
        cmd: mariadb -e "CREATE TABLE app.bk (id INT PRIMARY KEY, note CHAR(1)); INSERT INTO app.bk SELECT seq, 'A' FROM app.seq_1_to_50"
        creates: /var/lib/mysql/app/bk.ibd
      when: _se_backup

- name: Take the backups
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run tera backup and tera backup --incremental
      when: hostvars['db01']['_se_backup'] | bool
      block:
        - name: Run tera backup
          ansible.builtin.include_tasks: tasks/tera_run.yml
          vars:
            _se_case:
              playbook: playbooks/mariadb-backup.yml
              args: [-e, tera_backup_op=run]
              expect_success: true

        - name: Write rows B
          ansible.builtin.command:
            cmd: mariadb -e "INSERT INTO app.bk SELECT seq, 'B' FROM app.seq_51_to_100"
          delegate_to: db01
          become: true
          changed_when: true

        - name: Run tera backup --incremental
          ansible.builtin.include_tasks: tasks/tera_run.yml
          vars:
            _se_case:
              playbook: playbooks/mariadb-backup.yml
              args: [-e, tera_backup_op=run, -e, mariadb_backup_type=incremental]
              expect_success: true

        - name: Drop the table
          ansible.builtin.command:
            cmd: mariadb -e "DROP TABLE app.bk"
          delegate_to: db01
          become: true
          changed_when: true

        - name: Run tera restore
          ansible.builtin.include_tasks: tasks/tera_run.yml
          vars:
            _se_case:
              playbook: playbooks/mariadb-restore.yml
              args: [-e, tera_restore_confirm=true, -e, mariadb_restore_backup=latest]
              expect_success: true

- name: Check the restored data
  hosts: db01
  become: true
  gather_facts: false
  tasks:
    - name: Count rows per note
      ansible.builtin.command:
        cmd: mariadb -N -B -e "SELECT note, COUNT(*) FROM app.bk GROUP BY note ORDER BY note"
      register: _se_bk_rows
      changed_when: false
      when: _se_backup

    - name: Assert rows A and B are back
      ansible.builtin.assert:
        that:
          - _se_bk_rows.stdout_lines == ['A\t50', 'B\t50']
      when: _se_backup

- name: Add a pending config change
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Write extra custom config file
      ansible.builtin.copy:
        content: |
          # Molecule side effect: change applied by an interrupted run
          [mysqld]
          max_connections = 543
        dest: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/config/mariadb/db01/zz-pending.cnf"
        mode: "0644"

- name: Compute facts
  ansible.builtin.import_playbook: ../../playbooks/facts.yml

- name: Run config in check mode
  hosts: mariadb
  become: true
  gather_facts: false
  check_mode: true
  roles:
    - role: tera_defaults
  tasks:
    - name: Run mariadb config tasks in check mode
      ansible.builtin.include_role:
        name: mariadb
        tasks_from: "{{ item }}"
      loop:
        - vars.yml
        - config.yml

- name: Simulate a run interrupted after the config was written
  hosts: mariadb
  become: true
  gather_facts: false
  roles:
    - role: tera_defaults
  tasks:
    - name: Check marker was not written by the check mode run
      ansible.builtin.stat:
        path: "{{ mariadb_restart_marker }}"
      register: _se_marker_before

    - name: Assert check mode left no marker
      ansible.builtin.assert:
        that:
          - not _se_marker_before.stat.exists

    - name: Run mariadb config tasks only (no restart play follows)
      ansible.builtin.include_role:
        name: mariadb
        tasks_from: "{{ item }}"
      loop:
        - vars.yml
        - config.yml

    - name: Check marker after interrupted run
      ansible.builtin.stat:
        path: "{{ mariadb_restart_marker }}"
      register: _se_marker_after

    - name: Read running max_connections
      ansible.builtin.command:
        cmd: mariadb -N -e "SELECT @@max_connections"
      register: _se_running
      changed_when: false

    - name: Assert config is pending, not yet active
      ansible.builtin.assert:
        that:
          - _se_marker_after.stat.exists
          - _se_running.stdout | trim | int == 432
