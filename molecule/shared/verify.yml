---
- name: Verify standalone
  hosts: mariadb
  become: true
  gather_facts: true
  roles:
    - role: tera_defaults
  tasks:
    - name: Load MariaDB OS variables
      ansible.builtin.include_vars: "{{ playbook_dir }}/../../roles/mariadb/vars/{{ ansible_facts['os_family'] }}.yml"

    - name: Determine listen address and expected config
      ansible.builtin.set_fact:
        _verify_address: "{{ tera_listen_address | default(ip | default(ansible_facts['default_ipv4']['address'])) }}"
        # side_effect.yml adds zz-pending.cnf (ADR 0009 test); plain converge does not.
        _verify_pending_applied: >-
          {{ lookup('ansible.builtin.fileglob', tera_config_dir ~ '/mariadb/db01/zz-pending.cnf') | length > 0 }}

    - name: Set expected values
      ansible.builtin.set_fact:
        _verify_max_connections: "{{ 543 if _verify_pending_applied | bool else 432 }}"
        _verify_sources: >-
          {{ 'role:tera.cnf.j2, mariadb/tuning.cnf, mariadb/db01/host.cnf'
             ~ (', mariadb/db01/zz-pending.cnf' if _verify_pending_applied | bool else '') }}

    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Check MariaDB service is active and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts['services'][_mariadb_service ~ '.service']['state'] == 'running'
          - ansible_facts['services'][_mariadb_service ~ '.service']['status'] == 'enabled'

    - name: Read 99-tera.cnf
      ansible.builtin.slurp:
        src: "{{ _mariadb_config_dir }}/99-tera.cnf"
      register: _verify_cnf

    - name: Check Tera header and per-host override
      ansible.builtin.assert:
        that:
          - _verify_text.startswith('# Managed by Tera - JANGAN edit manual\n')
          - "('# Sources: ' ~ _verify_sources ~ '\n') in _verify_text"
          - "('max_connections = ' ~ _verify_max_connections ~ '\n') in _verify_text"
      vars:
        _verify_text: "{{ _verify_cnf['content'] | b64decode }}"

    - name: Query server as admin over TCP
      ansible.mysql.mysql_query:
        login_host: "{{ _verify_address }}"
        login_port: "{{ mariadb_port }}"
        login_user: "{{ mariadb_admin_user | default('tera_admin') }}"
        login_password: "{{ mariadb_admin_password }}"
        query:
          - SELECT @@max_connections AS max_connections, @@bind_address AS bind_address
          - SELECT COUNT(*) AS n FROM mysql.user WHERE user = ''
          - SELECT COUNT(*) AS n FROM information_schema.schemata WHERE schema_name = 'test'
          - SELECT COUNT(*) AS n FROM information_schema.schemata WHERE schema_name = 'app'
      register: _verify_query
      no_log: true

    - name: Check server state
      ansible.builtin.assert:
        that:
          - _verify_query.query_result[0][0]['max_connections'] | int == _verify_max_connections | int
          - _verify_query.query_result[0][0]['bind_address'] == _verify_address
          - _verify_query.query_result[1][0]['n'] | int == 0
          - _verify_query.query_result[2][0]['n'] | int == 0
          - _verify_query.query_result[3][0]['n'] | int == 1

    - name: Check datadir marker
      ansible.builtin.stat:
        path: "{{ mariadb_datadir_marker }}"
      register: _verify_datadir_marker

    - name: Check the datadir marker exists
      ansible.builtin.assert:
        that:
          - _verify_datadir_marker.stat.exists

    - name: Check restart pending marker
      ansible.builtin.stat:
        path: "{{ tera_state_dir }}/mariadb-restart-pending"
      register: _verify_marker

    - name: Check no restart is pending
      ansible.builtin.assert:
        that:
          - not _verify_marker.stat.exists

    # From the Molecule host, i.e. from outside the VM (ADR 0011). Not for podman: rootless containers
    # share the host address.
    - name: Connect to MariaDB from outside the VM
      ansible.builtin.wait_for:
        host: "{{ _verify_address }}"
        port: "{{ mariadb_port }}"
        search_regex: MariaDB
        timeout: 10
      delegate_to: localhost
      become: false
      when: lookup('ansible.builtin.env', 'MOLECULE_DRIVER_NAME') == 'vagrant'
