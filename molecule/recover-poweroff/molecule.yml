---
# Optional power-off variant of the recover scenario (docs/TESTING.md), NOT part of the default runs:
# all nodes are hard reset at once while a writer commits rows. MariaDB keeps its upstream restart
# policy, so the cluster may recover by itself (pc.recovery) or need tera recover; the test accepts
# both, records which one happened, and requires every acknowledged row to survive.
# Same platforms and variables as molecule/galera. Never run two 3-node scenarios at once.
# Collections are installed once into ./collections (see AGENTS.md); no per-run download.
dependency:
  name: galaxy
  enabled: false
driver:
  name: vagrant
  provider:
    name: libvirt
platforms:
  - &node
    name: db01
    box: ${TERA_BOX:-cloud-image/ubuntu-22.04}
    # "-" (not ":-"): an empty TERA_BOX_VERSION (box_url boxes, e.g. Rocky) must stay empty.
    box_version: ${TERA_BOX_VERSION-20260926.0.0}
    box_url: ${TERA_BOX_URL}
    box_download_checksum: ${TERA_BOX_CHECKSUM}
    box_download_checksum_type: ${TERA_BOX_CHECKSUM_TYPE}
    memory: 1536
    cpus: 2
    # See molecule/standalone/molecule.yml: system libvirt and full Rocky disk size.
    provider_options:
      qemu_use_session: false
      machine_virtual_size: 10
    groups:
      - mariadb
  - <<: *node
    name: db02
  - <<: *node
    name: db03
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
    ANSIBLE_FILTER_PLUGINS: ${MOLECULE_PROJECT_DIRECTORY}/plugins/filter
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/collections
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
    side_effect: side_effect.yml
    verify: ../galera/verify.yml
  inventory:
    group_vars:
      all:
        tera_action: deploy
        tera_config_dir: ${MOLECULE_EPHEMERAL_DIRECTORY}/config
        mariadb_cluster_mode: galera
        # Test-only passwords, generated outside the repo in the ephemeral directory.
        mariadb_admin_password: >-
          {{ lookup('ansible.builtin.password',
                    lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/admin_password',
                    chars=['ascii_letters', 'digits'], length=32) }}
        mariadb_sst_password: >-
          {{ lookup('ansible.builtin.password',
                    lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/sst_password',
                    chars=['ascii_letters', 'digits'], length=32) }}
        mariadb_clustercheck_password: >-
          {{ lookup('ansible.builtin.password',
                    lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/clustercheck_password',
                    chars=['ascii_letters', 'digits'], length=32) }}
        # Users are created on the bootstrap host only: list every node address explicitly. Only hosts
        # with a known address: a --limit run (negative test) has no fact cache for the others.
        mariadb_admin_hosts: >-
          {{ ['localhost'] + (groups['mariadb'] | map('extract', hostvars) | selectattr('tera_listen_address', 'defined')
             | map(attribute='tera_listen_address') | list) }}
        mariadb_databases:
          - name: app
    host_groups:
      loadbalancer: {}
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - side_effect
    - verify
    - destroy
verifier:
  name: ansible
