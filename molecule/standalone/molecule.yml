---
# Standalone scenario (docs/TESTING.md). One VM per run; the OS matrix and the pinned boxes
# (TERA_BOX, TERA_BOX_VERSION, TERA_BOX_URL, TERA_BOX_CHECKSUM*) are listed in docs/TESTING.md.
# Default matrix: Ubuntu 22.04, Ubuntu 24.04, Rocky 9. Optional platform (not run by default):
# AlmaLinux 9 (TERA_BOX=almalinux/9 TERA_BOX_VERSION=9.8.20260907).
# Collections are installed once into ./collections (see AGENTS.md); no per-run download.
dependency:
  name: galaxy
  enabled: false
driver:
  name: vagrant
  provider:
    name: libvirt
platforms:
  - name: db01
    box: ${TERA_BOX:-cloud-image/ubuntu-22.04}
    # "-" (not ":-"): an empty TERA_BOX_VERSION (box_url boxes, e.g. Rocky) must stay empty.
    box_version: ${TERA_BOX_VERSION-20260926.0.0}
    box_url: ${TERA_BOX_URL}
    box_download_checksum: ${TERA_BOX_CHECKSUM}
    box_download_checksum_type: ${TERA_BOX_CHECKSUM_TYPE}
    memory: 2048
    cpus: 2
    # Fedora's vagrant-libvirt package defaults to qemu:///session (no management network,
    # no DHCP lease for Vagrant to find). Always use the system libvirt.
    # The Rocky box metadata says virtual_size 5 (GB) but its image is 10 GiB; vagrant-libvirt
    # 0.11 trusts the metadata, truncates the disk and the guest drops to dracut emergency mode.
    # 10 matches the Ubuntu boxes; boxes with a larger image keep their own size.
    provider_options:
      qemu_use_session: false
      machine_virtual_size: 10
    groups:
      - mariadb
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
    ANSIBLE_FILTER_PLUGINS: ${MOLECULE_PROJECT_DIRECTORY}/plugins/filter
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/collections
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
    side_effect: ../shared/side_effect.yml
    verify: ../shared/verify.yml
  inventory:
    group_vars:
      all:
        tera_action: deploy
        tera_config_dir: ${MOLECULE_EPHEMERAL_DIRECTORY}/config
        # Test-only password, generated outside the repo in the ephemeral directory.
        mariadb_admin_password: >-
          {{ lookup('ansible.builtin.password',
                    lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/admin_password',
                    chars=['ascii_letters', 'digits'], length=32) }}
        mariadb_admin_hosts:
          - localhost
          - "{{ tera_listen_address }}"
        mariadb_databases:
          - name: app
    host_groups:
      loadbalancer: {}
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - converge
    - verify
    - destroy
verifier:
  name: ansible
