---
# Standalone scenario (docs/TESTING.md). One VM per run; the OS matrix is driven by TERA_BOX:
#   for box in generic/ubuntu2204 cloud-image/ubuntu-24.04 generic/rocky9; do
#     TERA_BOX=$box molecule test -s standalone
#   done
# Collections are installed once into ./collections (see AGENTS.md); no per-run download.
dependency:
  name: galaxy
  enabled: false
driver:
  name: vagrant
  provider:
    name: libvirt
platforms:
  - name: db01
    box: ${TERA_BOX:-generic/ubuntu2204}
    memory: 2048
    cpus: 2
    groups:
      - mariadb
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
    ANSIBLE_FILTER_PLUGINS: ${MOLECULE_PROJECT_DIRECTORY}/plugins/filter
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/collections
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
    verify: ../shared/verify.yml
  inventory:
    group_vars:
      all:
        tera_action: deploy
        tera_config_dir: ${MOLECULE_EPHEMERAL_DIRECTORY}/config
        # Test-only password, generated outside the repo in the ephemeral directory.
        mariadb_admin_password: >-
          {{ lookup('ansible.builtin.password',
                    lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/admin_password',
                    chars=['ascii_letters', 'digits'], length=32) }}
        mariadb_admin_hosts:
          - localhost
          - "{{ tera_listen_address }}"
        mariadb_databases:
          - name: app
    host_groups:
      loadbalancer: {}
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
verifier:
  name: ansible
