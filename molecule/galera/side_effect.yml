---
# Galera side effects (docs/TESTING.md):
# 1. prechecks refuse bad input before changing anything (separate ansible-playbook runs);
# 2. join: a stopped node rejoins on the next deploy, without a new bootstrap and without
#    restarting the nodes that stayed Primary (docs/GALERA-LIFECYCLE.md, "Join");
# 3. SST overwrite guard: a node without marker that holds user databases is refused, then joins
#    with mariadb_galera_allow_sst_overwrite=true.
# 4. Datadir guard: db02 with its datadir marker and an empty datadir (missing mount) makes deploy fail;
#    db02 is not refilled by SST on the root disk and the other nodes stay Primary. With the datadir
#    back, deploy rejoins db02.
- name: Negative prechecks
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _se_config_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/config"
  tasks:
    - name: Run deploy with bad input
      ansible.builtin.include_tasks: ../shared/tasks/tera_run.yml
      loop:
        - args: [-e, mariadb_galera_min_nodes=4]
          expect: "Mode galera butuh minimal 4 node"
        - args: [--limit, db01]
          expect: "tidak boleh memakai --limit"
        - args: [-e, '{"mariadb_sst_password": ""}']
          expect: "mariadb_sst_password atau mariadb_clustercheck_password kosong"
      loop_control:
        loop_var: _se_case
        label: "{{ _se_case.expect }}"

    - name: Add wsrep_sst_auth to custom config
      ansible.builtin.copy:
        content: |
          [galera]
          wsrep-sst-auth = someone:secret
        dest: "{{ _se_config_dir }}/mariadb/zz-sst-auth.cnf"
        mode: "0644"

    - name: Run deploy with wsrep_sst_auth in custom config
      ansible.builtin.include_tasks: ../shared/tasks/tera_run.yml
      vars:
        _se_case:
          args: []
          expect: "mariadb/zz-sst-auth.cnf berisi wsrep_sst_auth"

    - name: Remove wsrep_sst_auth from custom config
      ansible.builtin.file:
        path: "{{ _se_config_dir }}/mariadb/zz-sst-auth.cnf"
        state: absent

- name: Stop one node
  hosts: mariadb
  become: true
  gather_facts: true
  tasks:
    - name: Read MariaDB start time before
      ansible.builtin.systemd_service:
        name: mariadb
      register: _se_started_before

    - name: Stop MariaDB on db02
      ansible.builtin.systemd_service:
        name: mariadb
        state: stopped
      when: inventory_hostname == 'db02'

    # ADR 0005: the socket keeps answering, with 503 while the node is not Synced.
    - name: Query clustercheck on the stopped node
      ansible.builtin.uri:
        url: "http://{{ ansible_facts['default_ipv4']['address'] }}:9200/"
        status_code: [200, 503]
      register: _se_clustercheck_stopped
      when: inventory_hostname == 'db02'

    - name: Assert clustercheck reports 503 on the stopped node
      ansible.builtin.assert:
        that:
          - _se_clustercheck_stopped.status == 503
      when: inventory_hostname == 'db02'

- name: Deploy
  ansible.builtin.import_playbook: ../../site.yml

- name: Check the join
  hosts: mariadb
  become: true
  gather_facts: false
  tasks:
    - name: Read MariaDB start time after
      ansible.builtin.systemd_service:
        name: mariadb
      register: _se_started_after

    - name: Assert only db02 was started
      ansible.builtin.assert:
        that:
          - (_se_after != _se_before) == (inventory_hostname == 'db02')
      vars:
        _se_before: "{{ _se_started_before.status.ActiveEnterTimestampMonotonic }}"
        _se_after: "{{ _se_started_after.status.ActiveEnterTimestampMonotonic }}"

- name: Clustercheck on a desynced node
  hosts: db03
  become: true
  gather_facts: false
  tasks:
    - name: Desync db03
      ansible.builtin.command:
        cmd: mariadb -e "SET GLOBAL wsrep_desync = ON"
      changed_when: true

    - name: Query clustercheck while desynced
      ansible.builtin.uri:
        url: "http://{{ ansible_facts['default_ipv4']['address'] }}:9200/"
        status_code: [200, 503]
      register: _se_clustercheck_desynced

    - name: Resync db03
      ansible.builtin.command:
        cmd: mariadb -e "SET GLOBAL wsrep_desync = OFF"
      changed_when: true

    - name: Query clustercheck after resync
      ansible.builtin.uri:
        url: "http://{{ ansible_facts['default_ipv4']['address'] }}:9200/"
        status_code: [200, 503]
      register: _se_clustercheck_resynced
      until: _se_clustercheck_resynced.status == 200
      retries: 10
      delay: 1

    - name: Assert 503 while desynced (mariadb_clustercheck_available_when_donor is false)
      ansible.builtin.assert:
        that:
          - _se_clustercheck_desynced.status == 503

- name: Turn db03 into a node without marker that holds data
  hosts: db03
  become: true
  gather_facts: false
  roles:
    - role: tera_defaults
  tasks:
    - name: Stop MariaDB on db03
      ansible.builtin.systemd_service:
        name: mariadb
        state: stopped

    - name: Remove the bootstrap marker on db03
      ansible.builtin.file:
        path: "{{ mariadb_galera_marker }}"
        state: absent

- name: SST overwrite guard
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run deploy that would overwrite db03
      ansible.builtin.include_tasks: ../shared/tasks/tera_run.yml
      vars:
        _se_case:
          args: []
          expect: "db03 akan menerima SST (join tanpa marker"
          expect_also: "berisi database: app"

    - name: Run deploy that allows the overwrite
      ansible.builtin.include_tasks: ../shared/tasks/tera_run.yml
      vars:
        _se_case:
          args: [-e, mariadb_galera_allow_sst_overwrite=true]
          expect_success: true

- name: Empty the datadir of db02 as if its disk were not mounted
  hosts: db02
  become: true
  gather_facts: false
  tasks:
    - name: Stop MariaDB on db02
      ansible.builtin.systemd_service:
        name: mariadb
        state: stopped

    - name: Move the datadir away
      ansible.builtin.command:
        cmd: mv /var/lib/mysql /var/lib/mysql.tera-test
        creates: /var/lib/mysql.tera-test

    - name: Leave an empty datadir behind
      ansible.builtin.file:
        path: /var/lib/mysql
        state: directory
        owner: mysql
        group: mysql
        mode: "0755"

- name: Deploy over the empty datadir of db02
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run deploy
      ansible.builtin.include_tasks: ../shared/tasks/tera_run.yml
      vars:
        _se_case:
          expect: "Tera tidak membuat database kosong baru. Periksa mount dan disk datadir"

- name: Check db02 was not refilled and the others stayed Primary
  hosts: mariadb
  become: true
  gather_facts: false
  tasks:
    - name: List the datadir of db02
      ansible.builtin.find:
        paths: /var/lib/mysql
        file_type: any
        hidden: true
      register: _se_empty
      when: inventory_hostname == 'db02'

    - name: Assert nothing was initialized or received on db02
      ansible.builtin.assert:
        that:
          - _se_empty.matched == 0
      when: inventory_hostname == 'db02'

    - name: Read cluster state on the other nodes
      ansible.builtin.command:
        cmd: mariadb -N -B -e "SHOW GLOBAL STATUS WHERE Variable_name IN ('wsrep_cluster_status', 'wsrep_cluster_size')"
      register: _se_wsrep
      changed_when: false
      when: inventory_hostname != 'db02'

    - name: Assert the other nodes stayed Primary without db02
      ansible.builtin.assert:
        that:
          - "'wsrep_cluster_status=Primary' in _se_status"
          - "'wsrep_cluster_size=2' in _se_status"
        fail_msg: "{{ inventory_hostname }}: {{ _se_status }}"
      vars:
        _se_status: "{{ _se_wsrep.stdout_lines | map('split') | map('join', '=') | list }}"
      when: inventory_hostname != 'db02'

    - name: Remove the empty datadir
      ansible.builtin.file:
        path: /var/lib/mysql
        state: absent
      when: inventory_hostname == 'db02'

    - name: Move the datadir back
      ansible.builtin.command:
        cmd: mv /var/lib/mysql.tera-test /var/lib/mysql
        creates: /var/lib/mysql
      when: inventory_hostname == 'db02'

- name: Deploy with the datadir of db02 back
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run deploy
      ansible.builtin.include_tasks: ../shared/tasks/tera_run.yml
      vars:
        _se_case:
          expect_success: true
