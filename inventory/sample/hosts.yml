---
# Cluster inventory. One cluster = one folder (see docs/ARCHITECTURE.md).
#
# Standalone: exactly one host in `mariadb`.
# Galera: at least mariadb_galera_min_nodes (default 3) hosts in `mariadb`, and set
# mariadb_cluster_mode: galera in group_vars/all/tera.yml. The `loadbalancer` group is
# optional and may contain the same hosts (colocated).
#
# Optional group `mariadb_backup_target`: backup host(s) for off-node copies (ADR 0012); the backup node
# can only write there (rrsync -wo -no-del). Reference it in mariadb_backup_targets.
#
# Optional host var `ip`: address MariaDB listens on and peers use. Without it, Tera uses
# the IPv4 of tera_network_interface, then the default route address.
all:
  children:
    mariadb:
      hosts:
        db01:
          ansible_host: 192.0.2.11
          # ip: 10.0.0.11
        # db02:
        #   ansible_host: 192.0.2.12
        # db03:
        #   ansible_host: 192.0.2.13
    loadbalancer:
      hosts: {}
      # hosts:
      #   db01:
      #   db02:
      #   db03:
    mariadb_backup_target:
      hosts: {}
      # hosts:
      #   backup01:
      #     ansible_host: 192.0.2.50
