---
# Cluster variables. Defaults live in roles/tera_defaults/defaults/main.yml and
# roles/mariadb/defaults/main.yml; set only what differs here.

# ansible_user: ubuntu

# --- MariaDB ---------------------------------------------------------------
mariadb_cluster_mode: standalone # standalone | galera
# mariadb_version: "11.4"
# mariadb_port: 3306

# Remote admin user (root stays unix_socket only). Password: mariadb_admin_password.
# Host patterns allowed to log in as the admin user (default: localhost only).
# skip_name_resolve is on: use IPs or subnets. "%" (any host) triggers a precheck warning.
# mariadb_admin_user: tera_admin
# mariadb_admin_hosts:
#   - localhost
#   - "10.10.10.%"

# mariadb_databases:
#   - name: app
# mariadb_users:
#   - name: app
#     host: "%"
#     password: "{{ vault_app_password }}"
#     priv: "app.*:ALL"

# --- Network ---------------------------------------------------------------
# tera_network_interface: eth1

# --- Galera / load balancer (Fase 2/3) ---------------------------------------
# tera_cluster_name: "{{ inventory_dir | basename }}"             # backups and default galera name
# mariadb_galera_cluster_name: "{{ tera_cluster_name }}"           # must be unique per cluster
# tera_vip_address: 10.0.0.10                                     # must be unique per cluster
# keepalived_virtual_router_id: 51                                # must be unique per L2 network
# haproxy_stats_sources:                                          # who may open the stats page; [] = LB nodes only
#   - 10.10.10.0/24
# keepalived_interface: ""                                        # "" = interface holding the node address
# mariadb_lb_mode: single_writer                                  # single_writer | multi_writer
# tera_manage_firewall: true      # false = Tera never touches firewalld (deploy, reconfigure, destroy)
# mariadb_firewall_manage: true   # manage firewalld when it runs, both modes (ADR 0011); ufw is not managed
# mariadb_client_sources:          # who may reach mariadb_port (and the VIP); default ["0.0.0.0/0"]
#   - 10.10.10.0/24
# mariadb_selinux_permissive: false   # RHEL: Tera labels ports and loads a minimal policy instead

# --- Backup (ADR 0012, README "Backup") ---------------------------------------
# Off by default: every deploy/reconfigure warns until backups are enabled.
# mariadb_backup_enabled: true
# mariadb_backup_host: db03                 # default: last mariadb node; galera writer refused
# mariadb_backup_dir: /var/backups/tera/mariadb   # better on its own disk; never removed by destroy
# mariadb_backup_full_schedule: "Sun *-*-* 01:00:00"
# mariadb_backup_incremental_schedule: "Mon..Sat *-*-* 01:00:00"
# mariadb_backup_keep_full: 2               # chains kept (count, never age)
# mariadb_backup_targets:                   # off-node copies, always gpg encrypted
#   - name: bk
#     type: rsync
#     host: backup01                        # in group mariadb_backup_target
# mariadb_backup_gpg_public_key: "{{ inventory_dir }}/config/backup/backup.pub.asc"   # public key only
# mariadb_backup_encrypt_local: false
# mariadb_backup_throttle: ""               # galera: throttling lengthens the desync window
