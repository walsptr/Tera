---
name: CI

"on":
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev requirements
        run: pip install -r requirements-dev.txt
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml -p ./collections
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        run: ansible-lint
      - name: ruff
        run: ruff check plugins/ roles/
      - name: shellcheck
        run: |
          files=$(find . \( -path ./.git -o -path ./collections -o -path ./.venv \) -prune -o -type f \
            \( -name '*.sh' -o -name tera -o -name 'backup-target-*' -o -name 'tera-policy-rc.d' \) -print)
          if [ -n "$files" ]; then shellcheck $files; else echo "no shell scripts"; fi

  syntax-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev requirements
        run: pip install -r requirements-dev.txt
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml -p ./collections
      - name: Syntax check playbooks
        run: |
          for pb in site.yml playbooks/mariadb-recover.yml playbooks/destroy.yml; do
            ansible-playbook -i inventory/sample/hosts.yml "$pb" --syntax-check
          done

  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev requirements
        run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest plugins/

  molecule-podman:
    # Fast complement only; Galera, Keepalived, sysctl and SELinux need the VM scenarios.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - docker.io/library/ubuntu:22.04
          - docker.io/library/ubuntu:24.04
          - docker.io/rockylinux/rockylinux:9
          - docker.io/library/almalinux:9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev requirements
        run: pip install -r requirements-dev.txt
      - name: Install collections
        run: |
          ansible-galaxy collection install -r requirements.yml -p ./collections
          ansible-galaxy collection install -r molecule/requirements.yml -p ./collections
      - name: molecule test -s standalone-podman
        env:
          TERA_PODMAN_IMAGE: ${{ matrix.image }}
        run: molecule test -s standalone-podman
      - name: molecule test -s upgrade-podman
        env:
          TERA_PODMAN_IMAGE: ${{ matrix.image }}
        run: molecule test -s upgrade-podman
