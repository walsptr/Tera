---
- name: Apply loadbalancer role
  hosts: loadbalancer
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: tera_defaults
  tasks:
    - name: Run loadbalancer action
      ansible.builtin.include_role:
        name: loadbalancer
        tasks_from: "{{ tera_action }}.yml"
      when: tera_lb_enabled | bool
