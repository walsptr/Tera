- name: Destroy mariadb
  hosts: mariadb
  become: true
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: tera_defaults
  tasks:
    - name: Run mariadb destroy
      ansible.builtin.include_role:
        name: mariadb
        tasks_from: destroy.yml
