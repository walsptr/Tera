---
- name: Check OS family is supported
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['Debian', 'RedHat']
    fail_msg: "{{ inventory_hostname }}: OS family {{ ansible_facts['os_family'] }} tidak didukung. Lihat docs/ARCHITECTURE.md."
    quiet: true

- name: Check cluster mode and version
  ansible.builtin.assert:
    that:
      - mariadb_cluster_mode in ['standalone', 'galera']
      - mariadb_version is string
      - mariadb_version is match('^[0-9]+\.[0-9]+$')
    fail_msg: >-
      mariadb_cluster_mode harus 'standalone' atau 'galera' dan mariadb_version berupa string
      'MAJOR.MINOR' (mis. "11.4", pakai tanda kutip). Perbaiki group_vars/all/tera.yml.
    quiet: true

- name: Check standalone topology
  ansible.builtin.assert:
    that:
      - groups['mariadb'] | length == 1
    fail_msg: >-
      Mode standalone butuh tepat 1 host di group mariadb (sekarang {{ groups['mariadb'] | length }}:
      {{ groups['mariadb'] | join(', ') }}). Kurangi host di hosts.yml atau gunakan mode galera.
    quiet: true
  when: mariadb_cluster_mode == 'standalone'

- name: Check required passwords are set
  ansible.builtin.assert:
    that:
      - mariadb_admin_password is defined
      - mariadb_admin_password is string
      - mariadb_admin_password | length > 0
    fail_msg: >-
      mariadb_admin_password kosong. Jalankan ./tera genpwd -i inventory/<cluster>
      (lalu ansible-vault encrypt file passwords.yml).
    quiet: true
  no_log: true

- name: Check admin hosts
  ansible.builtin.assert:
    that:
      - mariadb_admin_host is not defined
      - mariadb_admin_hosts is sequence
      - mariadb_admin_hosts is not string
      - mariadb_admin_hosts | length > 0
    fail_msg: >-
      mariadb_admin_hosts harus berupa list host/subnet yang tidak kosong (mis. ["localhost", "10.10.10.%"]).
      Variabel lama mariadb_admin_host tidak dipakai lagi; pindahkan nilainya ke mariadb_admin_hosts.
    quiet: true

- name: Warn when admin user is open to any host
  ansible.builtin.debug:
    msg: >-
      PERINGATAN: mariadb_admin_hosts berisi "%", user {{ mariadb_admin_user }} bisa login dari host mana pun.
      Batasi ke subnet (mis. "10.10.10.%") di group_vars/all/tera.yml.
  when: "'%' in mariadb_admin_hosts"

- name: Check custom config directory is absolute
  ansible.builtin.assert:
    that:
      - tera_config_dir is match('^/')
    fail_msg: "tera_config_dir harus path absolut (sekarang '{{ tera_config_dir }}'). Gunakan default atau path absolut."
    quiet: true

- name: Check mariadb_client_sources
  ansible.builtin.assert:
    that:
      - mariadb_client_sources is sequence
      - mariadb_client_sources is not string
      - mariadb_client_sources | length > 0
      - _mariadb_bad_sources | length == 0
    fail_msg: >-
      mariadb_client_sources harus list IPv4/CIDR yang tidak kosong (mis. ["10.10.10.0/24", "10.20.0.5"],
      default ["0.0.0.0/0"]). Entri tidak valid: {{ _mariadb_bad_sources }}.
      CIDR tidak boleh punya bit host: tulis "10.0.0.0/24", bukan "10.0.0.5/24".
    quiet: true
  vars:
    _mariadb_bad_sources: >-
      {{ (mariadb_client_sources | zip(mariadb_client_sources | map('tera_is_ipv4_network'))
          | rejectattr('1') | map(attribute='0') | list)
         if (mariadb_client_sources is sequence and mariadb_client_sources is not string)
         else [mariadb_client_sources] }}

# ADR 0016: every *_sources is only enforced by Tera's firewalld rich rules.
- name: Collect service facts for the mariadb_client_sources warning
  ansible.builtin.service_facts:
  when: "'0.0.0.0/0' not in mariadb_client_sources"

- name: Warn when mariadb_client_sources is not enforced
  ansible.builtin.debug:
    msg: >-
      PERINGATAN: {{ inventory_hostname }}: mariadb_client_sources membatasi sumber ({{ mariadb_client_sources | join(', ') }}),
      tetapi firewalld {{ 'tidak berjalan' if _mariadb_fw_managed | bool else 'tidak dikelola Tera' }} di host ini:
      sources tidak ditegakkan, port {{ mariadb_port }} terbuka untuk siapa saja yang bisa menjangkau host ini.
      Batasi lewat firewall jaringan atau ufw (README, bagian Keamanan), atau jalankan firewalld.
  when:
    - "'0.0.0.0/0' not in mariadb_client_sources"
    - not (_mariadb_fw_managed | bool) or (ansible_facts['services']['firewalld.service']['state'] | default('')) != 'running'
  vars:
    _mariadb_fw_managed: "{{ (tera_manage_firewall | bool) and (mariadb_firewall_manage | bool) }}"

- name: Check ufw status
  ansible.builtin.command:
    cmd: ufw status
  register: _mariadb_ufw
  changed_when: false
  failed_when: false
  check_mode: false

- name: Warn when ufw is active
  ansible.builtin.debug:
    msg: >-
      PERINGATAN: ufw aktif di {{ inventory_hostname }}. Tera tidak mengelola ufw (ADR 0011).
      Buka {{ mariadb_port }}/tcp dari {{ mariadb_client_sources | join(', ') }}{% if mariadb_cluster_mode == 'galera' %},
      port Galera dari setiap node cluster (4567/tcp, 4567/udp, 4568/tcp, 4444/tcp; mis. ufw allow proto tcp
      from <ip-node> to any port 4567,4568,4444 dan ufw allow proto udp from <ip-node> to any port 4567), dan
      {{ mariadb_clustercheck_port }}/tcp dari node load balancer{% endif %}.
  when: "(_mariadb_ufw.stdout | default('')) is search('Status: active')"

# 99-tera.cnf never holds secrets, and a wsrep_sst_auth there would silently override 98-tera-sst.cnf
# (docs/CUSTOM-CONFIG.md, "Secret"). Raw scan; config.yml checks the merged result again.
- name: Check custom config does not set wsrep_sst_auth
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.file', item) is not search('^\s*wsrep[-_]sst[-_]auth\s*(=|$)', multiline=True, ignorecase=True)
    fail_msg: >-
      {{ item | relpath(tera_config_dir) }} berisi wsrep_sst_auth. Hapus key itu dari custom config:
      kredensial SST dikelola Tera di 98-tera-sst.cnf dari mariadb_sst_user dan mariadb_sst_password.
    quiet: true
  loop: >-
    {{ query('ansible.builtin.fileglob', tera_config_dir ~ '/mariadb/*.cnf')
       + query('ansible.builtin.fileglob', tera_config_dir ~ '/mariadb/' ~ inventory_hostname ~ '/*.cnf') }}
  loop_control:
    label: "{{ item | relpath(tera_config_dir) }}"

- name: Check galera topology
  ansible.builtin.assert:
    that:
      - groups['mariadb'] | length >= mariadb_galera_min_nodes | int
      - mariadb_bootstrap_host in groups['mariadb']
    fail_msg: >-
      Mode galera butuh minimal {{ mariadb_galera_min_nodes }} node di group mariadb (sekarang
      {{ groups['mariadb'] | length }}: {{ groups['mariadb'] | join(', ') }}) dan mariadb_bootstrap_host
      ('{{ mariadb_bootstrap_host }}') harus salah satu node itu. Tambah host di hosts.yml atau perbaiki
      mariadb_bootstrap_host di group_vars/all/tera.yml.
    quiet: true
  when: mariadb_cluster_mode == 'galera'

- name: Warn about an even number of galera nodes
  ansible.builtin.debug:
    msg: >-
      PERINGATAN: jumlah node galera genap ({{ groups['mariadb'] | length }}). Jika jaringan terbelah dua sama
      besar, tidak ada sisi yang punya quorum dan cluster berhenti melayani. Gunakan jumlah node ganjil.
  when:
    - mariadb_cluster_mode == 'galera'
    - groups['mariadb'] | length is even

- name: Refuse --limit on galera deploy
  ansible.builtin.assert:
    that:
      - ansible_play_hosts_all | sort == groups['mariadb'] | sort
    fail_msg: >-
      tera deploy mode galera tidak boleh memakai --limit (host di run ini: {{ ansible_play_hosts_all | join(', ') }};
      group mariadb: {{ groups['mariadb'] | join(', ') }}). Bootstrap dan join butuh status semua node.
      Ulangi tanpa --limit. Untuk menerapkan config ke sebagian host, pakai tera reconfigure --limit.
    quiet: true
  when:
    - mariadb_cluster_mode == 'galera'
    - tera_action == 'deploy'

- name: Check galera passwords are set
  ansible.builtin.assert:
    that:
      - mariadb_sst_password is defined
      - mariadb_sst_password is string
      - mariadb_sst_password | length > 0
      - mariadb_clustercheck_password is defined
      - mariadb_clustercheck_password is string
      - mariadb_clustercheck_password | length > 0
    fail_msg: >-
      mariadb_sst_password atau mariadb_clustercheck_password kosong. Jalankan ./tera genpwd -i inventory/<cluster>
      (lalu ansible-vault encrypt file passwords.yml).
    quiet: true
  no_log: true
  when: mariadb_cluster_mode == 'galera'

# SST overwrites the joiner datadir. A node that will receive an SST without the bootstrap marker
# must not hold user databases (docs/GALERA-LIFECYCLE.md, "Prasyarat deploy"). Filesystem level,
# so it works while MariaDB is stopped. The bootstrap host of a fresh cluster is the SST source.
- name: Check data safety before SST
  when: mariadb_cluster_mode == 'galera'
  block:
    - name: Load variables for status
      ansible.builtin.include_tasks: vars.yml

    - name: Read Galera status
      ansible.builtin.include_tasks: status.yml

    - name: Decide whether this node will receive an SST
      ansible.builtin.set_fact:
        _mariadb_sst_receiver: >-
          {{ ((not _galera_cluster_alive) and (not _galera_ever_bootstrapped)
              and (inventory_hostname != mariadb_bootstrap_host))
             or (_galera_cluster_alive and (not _mariadb_wsrep_primary) and (not _mariadb_bootstrapped_marker)) }}

    - name: Find databases in the datadir
      ansible.builtin.find:
        paths: "{{ mariadb_datadir }}"
        file_type: directory
        recurse: false
      register: _mariadb_datadir_dirs
      check_mode: false
      when: _mariadb_sst_receiver | bool

    - name: Refuse an SST that would overwrite user databases
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} akan menerima SST
          ({{ 'bootstrap cluster baru' if not _galera_cluster_alive else 'join tanpa marker ' ~ mariadb_galera_marker }}),
          dan SST menimpa {{ mariadb_datadir }} yang berisi database: {{ _mariadb_user_databases | join(', ') }}.
          {% if not _galera_cluster_alive %}Jika data ini yang harus dipertahankan, jadikan node ini sumber cluster dengan
          mariadb_bootstrap_host: {{ inventory_hostname }} di group_vars/all/tera.yml.{% else %}Backup atau pindahkan
          data ini dulu jika masih dibutuhkan.{% endif %}
          Jika data ini memang boleh dibuang, ulangi dengan -e mariadb_galera_allow_sst_overwrite=true.
      vars:
        _mariadb_user_databases: >-
          {{ _mariadb_datadir_dirs.files | map(attribute='path') | map('basename')
             | reject('in', ['mysql', 'performance_schema', 'sys']) | sort | list }}
      when:
        - _mariadb_sst_receiver | bool
        - _mariadb_user_databases | length > 0
        - not (mariadb_galera_allow_sst_overwrite | bool)
