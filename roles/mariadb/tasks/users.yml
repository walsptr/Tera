---
# root@localhost stays unix_socket (ADR 0008): connect through the socket as OS root (become).
- name: Manage MariaDB users and databases
  module_defaults:
    group/ansible.mysql.all:
      login_user: root
      login_unix_socket: "{{ _mariadb_socket }}"
  block:
    - name: Remove anonymous users
      ansible.mysql.mysql_user:
        name: ""
        host_all: true
        state: absent

    - name: Remove test database
      ansible.mysql.mysql_db:
        name: test
        state: absent

    - name: Show admin accounts to manage
      ansible.builtin.debug:
        msg: "{{ mariadb_admin_hosts | map('regex_replace', '^', mariadb_admin_user ~ '@') | list }}"

    - name: Create admin user
      ansible.mysql.mysql_user:
        name: "{{ mariadb_admin_user }}"
        host: "{{ item }}"
        password: "{{ mariadb_admin_password }}"
        priv: "*.*:ALL,GRANT"
        state: present
      loop: "{{ mariadb_admin_hosts }}"
      no_log: true

    # Used by the donor (mariabackup) during SST; must exist before any joiner starts.
    - name: Create SST user
      ansible.mysql.mysql_user:
        name: "{{ mariadb_sst_user }}"
        host: localhost
        password: "{{ mariadb_sst_password }}"
        priv: "*.*:RELOAD,PROCESS,LOCK TABLES,BINLOG MONITOR"
        state: present
      when: mariadb_cluster_mode == 'galera'
      no_log: true

    # tera-clustercheck only reads SHOW GLOBAL STATUS: no privilege needed (ADR 0005).
    - name: Create clustercheck user
      ansible.mysql.mysql_user:
        name: "{{ mariadb_clustercheck_user }}"
        host: localhost
        password: "{{ mariadb_clustercheck_password }}"
        priv: "*.*:USAGE"
        state: present
      when: mariadb_cluster_mode == 'galera'
      no_log: true

    - name: Manage databases
      ansible.mysql.mysql_db:
        name: "{{ item.name }}"
        encoding: "{{ item.encoding | default(omit) }}"
        collation: "{{ item.collation | default(omit) }}"
        state: "{{ item.state | default('present') }}"
      loop: "{{ mariadb_databases }}"
      loop_control:
        label: "{{ item.name }}"

    # The loop below is no_log (labels are censored too), so show only user@host here.
    - name: Show users to manage
      ansible.builtin.debug:
        msg: "{{ mariadb_users | map(attribute='name') | zip(mariadb_users | map(attribute='host', default='%')) | map('join', '@') | list }}"
      when: mariadb_users | length > 0

    - name: Manage users
      ansible.mysql.mysql_user:
        name: "{{ item.name }}"
        host: "{{ item.host | default('%') }}"
        password: "{{ item.password | default(omit) }}"
        priv: "{{ item.priv | default(omit) }}"
        state: "{{ item.state | default('present') }}"
      loop: "{{ mariadb_users }}"
      loop_control:
        label: "{{ item.name }}@{{ item.host | default('%') }}"
      no_log: true
