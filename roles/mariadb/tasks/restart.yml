---
# Called only from the rolling restart play (serial: 1, max_fail_percentage: 0) for hosts
# with mariadb_restart_required. Never from a handler (ADR 0007, docs/GALERA-LIFECYCLE.md).
- name: Load variables
  ansible.builtin.import_tasks: vars.yml

# Under the backup lock (ADR 0012): waits for a running backup, and no backup starts during the
# restart. flock exits 75 when mariadb_backup_lock_timeout runs out.
- name: Restart MariaDB
  ansible.builtin.command:
    cmd: >-
      flock -w {{ mariadb_backup_lock_timeout }} -E 75 {{ mariadb_backup_lock }}
      systemctl restart {{ _mariadb_service }}
  register: _mariadb_restart
  changed_when: true
  failed_when: false

- name: Check the restart was not blocked by a backup
  ansible.builtin.assert:
    that:
      - _mariadb_restart.rc | default(0) != 75
    fail_msg: >-
      {{ inventory_hostname }}: restart MariaDB menunggu backup yang sedang berjalan lebih dari
      {{ mariadb_backup_lock_timeout }} detik ({{ mariadb_backup_lock }} masih dipegang; lihat
      systemctl status 'tera-backup@*'). Node lain belum di-restart. Tunggu backup selesai lalu ulangi run yang
      sama, atau naikkan mariadb_backup_lock_timeout.
    quiet: true

- name: Check MariaDB restarted
  ansible.builtin.assert:
    that:
      - _mariadb_restart.rc | default(0) == 0
    fail_msg: >-
      {{ inventory_hostname }}: systemctl restart {{ _mariadb_service }} gagal (rc={{ _mariadb_restart.rc }}):
      {{ _mariadb_restart.stderr | default('') }}. Periksa journalctl -u {{ _mariadb_service }}.
    quiet: true

- name: Wait for MariaDB port
  ansible.builtin.wait_for:
    host: "{{ tera_listen_address }}"
    port: "{{ mariadb_port }}"
    timeout: "{{ mariadb_port_timeout }}"
  when: not ansible_check_mode

- name: Wait for Galera node to be Synced
  ansible.builtin.include_tasks: wait_synced.yml
  when: mariadb_cluster_mode == 'galera'

# Only after the node is back (port open, Synced for galera): ADR 0009.
- name: Remove restart pending marker
  ansible.builtin.file:
    path: "{{ mariadb_restart_marker }}"
    state: absent

- name: Clear restart flag
  ansible.builtin.set_fact:
    mariadb_restart_required: false
