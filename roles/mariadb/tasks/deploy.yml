---
- name: Run prechecks
  ansible.builtin.import_tasks: prechecks.yml

- name: Load variables
  ansible.builtin.import_tasks: vars.yml

- name: Install MariaDB
  ansible.builtin.import_tasks: install.yml

# Before any galera node starts: joiners must reach the other nodes (ADR 0010).
- name: Open firewall ports
  ansible.builtin.include_tasks: firewall.yml
  when:
    - mariadb_cluster_mode == 'galera'
    - mariadb_firewall_manage | bool

- name: Configure MariaDB
  ansible.builtin.import_tasks: config.yml

- name: Start MariaDB (standalone)
  ansible.builtin.include_tasks: standalone.yml
  when: mariadb_cluster_mode == 'standalone'

- name: Bootstrap or join Galera cluster
  ansible.builtin.include_tasks: galera.yml
  when: mariadb_cluster_mode == 'galera'

# Galera replicates users and databases: manage them on the bootstrap host only.
- name: Manage users and databases
  ansible.builtin.include_tasks: users.yml
  when: (mariadb_cluster_mode == 'standalone') or (inventory_hostname == mariadb_bootstrap_host)
