---
# Upgrade one node (ADR 0015). Called from playbooks/mariadb-upgrade.yml (serial: 1, max_fail_percentage: 0,
# writer last) for nodes with _mariadb_upgrade_needed, after upgrade_prechecks.yml resolved the versions.
# Order: backup lock -> drain -> stop -> packages (Ubuntu: Tera policy-rc.d) -> start -> Synced ->
# mariadb-upgrade --force -> undrain. The socket and the lock are always restored.
- name: Load variables
  ansible.builtin.import_tasks: vars.yml

- name: Set upgrade paths
  ansible.builtin.set_fact:
    _mariadb_upgrade_log: "/var/log/tera/mariadb-upgrade-{{ _mariadb_upgrade_target }}-{{ tera_upgrade_id }}"
    _mariadb_upgrade_drain: "{{ tera_lb_enabled | bool }}"

- name: Create the Tera log directory
  ansible.builtin.file:
    path: /var/log/tera
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Upgrade this node
  block:
    # A backup holds mariadb_backup_lock (ADR 0012). The lock is held by a transient unit for the whole node
    # upgrade (mariabackup must not run while its binary and the server change), at most
    # mariadb_backup_lock_timeout seconds; the always section and the next deploy release it.
    - name: Take the backup lock
      ansible.builtin.command:
        argv:
          - systemd-run
          - --unit=tera-mariadb-upgrade-lock
          - --collect
          - --property=ExecStopPost=/bin/rm -f /run/tera-mariadb-upgrade-lock.held
          - flock
          - -w
          - "{{ mariadb_backup_lock_timeout }}"
          - -E
          - "75"
          - "{{ mariadb_backup_lock }}"
          - sh
          - -c
          - "touch /run/tera-mariadb-upgrade-lock.held && exec sleep {{ mariadb_backup_lock_timeout }}"
      changed_when: true

    - name: Wait for the backup lock
      ansible.builtin.stat:
        path: /run/tera-mariadb-upgrade-lock.held
      register: _mariadb_upgrade_lock_held
      until: _mariadb_upgrade_lock_held.stat.exists
      retries: "{{ (mariadb_backup_lock_timeout | int / 5) | int + 1 }}"
      delay: 5
      failed_when: false

    - name: Check the backup lock was taken
      ansible.builtin.assert:
        that:
          - _mariadb_upgrade_lock_held.stat.exists
        fail_msg: >-
          {{ inventory_hostname }}: lock backup {{ mariadb_backup_lock }} tidak didapat dalam
          {{ mariadb_backup_lock_timeout }} detik (backup masih berjalan; lihat systemctl status 'tera-backup@*').
          Node ini belum disentuh; ulangi tera upgrade setelah backup selesai.
        quiet: true

    - name: Drain the node (stop tera-clustercheck)
      ansible.builtin.systemd_service:
        name: tera-clustercheck.socket
        state: stopped
      when: mariadb_cluster_mode == 'galera'

    - name: Wait until HAProxy marks the node DOWN
      ansible.builtin.include_tasks: upgrade_lb_wait.yml
      vars:
        _mariadb_lb_wait_for: down
      when: _mariadb_upgrade_drain | bool

    - name: Pause after the drain (test-only fault injection)
      ansible.builtin.pause:
        seconds: "{{ __tera_test_upgrade_pause_after_drain }}"
      when: (__tera_test_upgrade_pause_after_drain | default(0) | int) > 0

    - name: Stop MariaDB
      ansible.builtin.systemd_service:
        name: "{{ _mariadb_service }}"
        state: stopped

    - name: Upgrade the packages
      ansible.builtin.include_tasks: upgrade_packages.yml

    - name: Start MariaDB
      ansible.builtin.systemd_service:
        name: "{{ _mariadb_service }}"
        state: started

    - name: Wait for MariaDB port
      ansible.builtin.wait_for:
        host: "{{ tera_listen_address }}"
        port: "{{ mariadb_port }}"
        timeout: "{{ mariadb_port_timeout }}"

    - name: Wait for Galera node to be Synced
      ansible.builtin.include_tasks: wait_synced.yml
      when: mariadb_cluster_mode == 'galera'

    # Ubuntu: mariadb.service runs /etc/mysql/debian-start after every start, which runs
    # mariadb-upgrade --version-check in the background. Never run two mariadb-upgrade at once.
    - name: Wait for the mariadb-upgrade of debian-start
      ansible.builtin.command:
        cmd: pgrep -x mariadb-upgrade
      register: _mariadb_upgrade_debian_start
      until: _mariadb_upgrade_debian_start.rc == 1
      retries: "{{ (mariadb_upgrade_debian_start_timeout | int / 2) | int }}"
      delay: 2
      changed_when: false
      failed_when: _mariadb_upgrade_debian_start.rc not in [0, 1]
      when: ansible_facts['os_family'] == 'Debian'

    - name: Check the mariadb-upgrade of debian-start finished
      ansible.builtin.assert:
        that:
          - _mariadb_upgrade_debian_start.rc == 1
        fail_msg: >-
          {{ inventory_hostname }}: mariadb-upgrade dari /etc/mysql/debian-start masih berjalan setelah
          {{ mariadb_upgrade_debian_start_timeout }} detik (mariadb_upgrade_debian_start_timeout). MariaDB sudah
          berjalan di versi baru; periksa journalctl -t /etc/mysql/debian-start, lalu ulangi tera upgrade.
        quiet: true
      when: ansible_facts['os_family'] == 'Debian'

    # Local to this node: Galera does not replicate it, so it runs on every node (ADR 0015).
    - name: Run mariadb-upgrade --force
      ansible.builtin.command:
        cmd: mariadb-upgrade --force
      register: _mariadb_upgrade_tables
      changed_when: true
      failed_when: false

    - name: Save the mariadb-upgrade output
      ansible.builtin.copy:
        content: |
          # tera upgrade {{ tera_upgrade_id }} on {{ inventory_hostname }}: mariadb-upgrade --force (rc={{ _mariadb_upgrade_tables.rc }})
          # debian-start mariadb-upgrade checks before this run: {{ _mariadb_upgrade_debian_start.attempts | default('n/a') }}
          {{ _mariadb_upgrade_tables.stdout }}
          {{ _mariadb_upgrade_tables.stderr }}
        dest: "{{ _mariadb_upgrade_log }}-mariadb-upgrade.log"
        owner: root
        group: root
        mode: "0640"

    - name: Check mariadb-upgrade succeeded
      ansible.builtin.assert:
        that:
          - _mariadb_upgrade_tables.rc == 0
        fail_msg: >-
          {{ inventory_hostname }}: mariadb-upgrade --force gagal (rc={{ _mariadb_upgrade_tables.rc }}), output di
          {{ _mariadb_upgrade_log }}-mariadb-upgrade.log: {{ _mariadb_upgrade_tables.stderr | default('') | truncate(400) }}
        quiet: true

    - name: Read mariadb_upgrade_info
      ansible.builtin.slurp:
        src: "{{ mariadb_datadir }}/mariadb_upgrade_info"
      register: _mariadb_upgrade_info

    - name: Check mariadb_upgrade_info has the target version
      ansible.builtin.assert:
        that:
          - (_mariadb_upgrade_info.content | b64decode) is match(_mariadb_upgrade_target ~ '-MariaDB')
        fail_msg: >-
          {{ inventory_hostname }}: {{ mariadb_datadir }}/mariadb_upgrade_info berisi
          '{{ _mariadb_upgrade_info.content | b64decode | trim }}', bukan {{ _mariadb_upgrade_target }}.
        quiet: true

  always:
    - name: Undrain the node (start tera-clustercheck)
      ansible.builtin.systemd_service:
        name: tera-clustercheck.socket
        state: started
      when: mariadb_cluster_mode == 'galera'

    - name: Release the backup lock
      ansible.builtin.systemd_service:
        name: tera-mariadb-upgrade-lock.service
        state: stopped
      failed_when: false

- name: Wait until HAProxy marks the node UP
  ansible.builtin.include_tasks: upgrade_lb_wait.yml
  vars:
    _mariadb_lb_wait_for: up
  when: _mariadb_upgrade_drain | bool

- name: Show the upgraded node
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: di-upgrade ke MariaDB {{ _mariadb_upgrade_target }}{% if _mariadb_upgrade_has_galera | bool %}
      dan galera-4 {{ _mariadb_upgrade_galera_target }}{% endif %}. Log: {{ _mariadb_upgrade_log }}-*.log.
