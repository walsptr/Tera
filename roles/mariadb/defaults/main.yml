---
# MariaDB role defaults. Values shared with other plays live in roles/tera_defaults.

# --- Upstream repository ----------------------------------------------------
# Set to false when the nodes already have a MariaDB repository (e.g. internal mirror).
mariadb_repo_manage: true
mariadb_repo_deb_url: "https://mirror.mariadb.org/repo/{{ mariadb_version }}/{{ ansible_facts['distribution'] | lower }}"
mariadb_repo_deb_key_url: https://mariadb.org/mariadb_release_signing_key.pgp
mariadb_repo_rpm_url: "https://rpm.mariadb.org/{{ mariadb_version }}/rhel/{{ ansible_facts['distribution_major_version'] }}/$basearch"
mariadb_repo_rpm_key_url: https://rpm.mariadb.org/RPM-GPG-KEY-MariaDB

mariadb_packages_extra: []

# --- Galera -----------------------------------------------------------------
# SST user (mariabackup), password from mariadb_sst_password (passwords.yml). The credentials
# are written to 98-tera-sst.cnf, never to 99-tera.cnf.
mariadb_sst_user: tera_sst
# A node that will receive an SST without the bootstrap marker must not hold user databases (SST
# overwrites the datadir). Set true only to discard that data on purpose.
mariadb_galera_allow_sst_overwrite: false
# tera-clustercheck user (ADR 0005), password from mariadb_clustercheck_password.
mariadb_clustercheck_user: tera_clustercheck
# `tera recover`: force the bootstrap node (inventory hostname). Empty = choose automatically
# (safe_to_bootstrap: 1, then highest seqno). Forcing a node with older data loses the newer data.
mariadb_recover_from: ""
# Manage firewalld when it runs, in both modes (ADR 0011). ufw is never managed. Ignored (never
# managed) when tera_manage_firewall is false.
mariadb_firewall_manage: true
# Make the SELinux domain mysqld_t permissive (RHEL). Off by default: Tera labels the Galera ports
# and loads a minimal tera_galera policy module instead.
mariadb_selinux_permissive: false

# --- Users ------------------------------------------------------------------
# root@localhost stays unix_socket only (ADR 0008). Remote admin access uses this user,
# password from mariadb_admin_password (passwords.yml).
# One account per host pattern in mariadb_admin_hosts (skip_name_resolve: use IPs/subnets,
# e.g. "10.10.10.%"). "%" (any host) is allowed but prechecks warn about it.
# Hosts removed from this list are not dropped automatically.
mariadb_admin_user: tera_admin
mariadb_admin_hosts:
  - localhost

# mariadb_databases:
#   - name: app
#     encoding: utf8mb4          # optional
#     collation: utf8mb4_general_ci  # optional
#     state: present             # optional
mariadb_databases: []

# mariadb_users:
#   - name: app
#     host: "%"                  # optional, default "%"
#     password: "{{ vault_app_password }}"
#     priv: "app.*:ALL"          # optional
#     state: present             # optional
mariadb_users: []

# --- Upgrade (ADR 0015) -------------------------------------------------------
# Target of `tera upgrade`: a patch version in the mariadb_version series ("11.4.13") or "latest" (highest
# version in the configured repository). Resolved once at the start of the run, the same on every node.
mariadb_upgrade_to: ""
# galera-4 target, same rules ("latest" = highest version in the repository).
mariadb_upgrade_galera_to: latest
# With backups on, upgrade needs a successful, verified backup at most this old (seconds).
mariadb_upgrade_max_backup_age: 86400
# Backups off: upgrade is refused unless this is true.
mariadb_upgrade_allow_without_backup: false
# Package operations: retries (with a delay) and the free space needed in /var (MiB).
mariadb_upgrade_package_retries: 3
mariadb_upgrade_package_delay: 10
mariadb_upgrade_min_free_mb: 1024
# Ubuntu: how long to wait for the background mariadb-upgrade of /etc/mysql/debian-start (seconds).
mariadb_upgrade_debian_start_timeout: 600
# How long to wait for HAProxy to mark a node DOWN after the drain / UP after it (seconds).
mariadb_upgrade_lb_timeout: 60
