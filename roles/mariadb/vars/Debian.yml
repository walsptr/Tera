---
_mariadb_packages:
  - mariadb-server
  - mariadb-client
  - python3-pymysql
_mariadb_config_dir: /etc/mysql/mariadb.conf.d
_mariadb_service: mariadb
_mariadb_socket: /run/mysqld/mysqld.sock
_mariadb_galera_packages:
  - galera-4
  - mariadb-backup
  - socat
_mariadb_galera_provider: /usr/lib/galera/libgalera_smm.so
