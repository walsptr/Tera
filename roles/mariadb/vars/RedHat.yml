---
_mariadb_packages:
  - MariaDB-server
  - MariaDB-client
  - python3-PyMySQL
_mariadb_config_dir: /etc/my.cnf.d
_mariadb_service: mariadb
_mariadb_socket: /var/lib/mysql/mysql.sock
# SST (wsrep_sst_mariabackup) needs socat and one of ss/lsof/sockstat. lsof used to come in as a weak
# dependency of MariaDB-server; Tera installs no weak dependencies (ADR 0015) and lists iproute (ss).
_mariadb_galera_packages:
  - galera-4
  - MariaDB-backup
  - socat
  - iproute
_mariadb_galera_provider: /usr/lib64/galera-4/libgalera_smm.so
_mariadb_selinux_packages:
  - policycoreutils-python-utils
  - checkpolicy
