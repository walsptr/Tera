---
# firewalld on the load balancer nodes (ADR 0011): only when firewalld already runs, default zone.
# Owned here: VRRP between load balancers, the stats port, and the client port on load balancers that
# are not MariaDB nodes (on MariaDB nodes the mariadb role owns it, with the same sources).
- name: Collect service facts for firewall
  ansible.builtin.service_facts:

- name: Manage firewalld
  when: (ansible_facts['services']['firewalld.service']['state'] | default('')) == 'running'
  block:
    - name: Compute expected load balancer firewall rules
      ansible.builtin.set_fact:
        _lb_fw_manage_client: "{{ inventory_hostname not in groups['mariadb'] }}"
        _lb_fw_rules: >-
          {{ (_lb_peers | map('regex_replace', '^(.*)$',
                              'rule family="ipv4" source address="\1" protocol value="vrrp" accept') | list)
             + (_lb_stats_sources | map('tera_fw_rich_rule', haproxy_stats_port ~ '/tcp') | list)
             + ((mariadb_client_sources | map('tera_fw_rich_rule', mariadb_port ~ '/tcp') | list)
                if (inventory_hostname not in groups['mariadb'] and '0.0.0.0/0' not in mariadb_client_sources)
                else []) }}
        _lb_fw_owned: >-
          {{ ['protocol value="vrrp"', 'port port="' ~ haproxy_stats_port ~ '"']
             + (['port port="' ~ mariadb_port ~ '"'] if inventory_hostname not in groups['mariadb'] else []) }}
      vars:
        # /metrics lives on the stats port (ADR 0016).
        _lb_stats_sources: >-
          {{ (haproxy_stats_sources + (tera_monitoring_sources if (haproxy_prometheus_enabled | bool) else []))
             | unique | list }}
        _lb_peers: >-
          {{ groups['loadbalancer'] | reject('equalto', inventory_hostname)
             | map('extract', hostvars, 'tera_listen_address') | list }}

    - name: Read current firewalld rules
      ansible.posix.firewalld_info:
        active_zones: true
      register: _lb_fw_info
      check_mode: false

    - name: Compute load balancer firewall rules to remove
      ansible.builtin.set_fact:
        _lb_fw_remove: >-
          {{ (_lb_fw_zone.rich_rules | default([]))
             | select('search', '(' ~ (_lb_fw_owned | map('regex_escape') | join('|')) ~ ')')
             | reject('in', _lb_fw_rules) | list }}
      vars:
        _lb_fw_zone: "{{ _lb_fw_info.firewalld_info.zones[_lb_fw_info.firewalld_info.default_zone] }}"

    # Visible in normal runs and in --check --diff (ADR 0011: Tera owns these rules).
    - name: Show load balancer firewall rules Tera will remove
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: aturan firewalld yang akan dihapus Tera (ADR 0011): {{ _lb_fw_remove }}."
      when: _lb_fw_remove | length > 0

    - name: Open or close the client port for the whole zone
      ansible.posix.firewalld:
        port: "{{ mariadb_port }}/tcp"
        permanent: true
        immediate: true
        state: "{{ 'enabled' if '0.0.0.0/0' in mariadb_client_sources else 'disabled' }}"
      when: _lb_fw_manage_client | bool

    - name: Remove load balancer rich rules that are no longer expected
      ansible.posix.firewalld:
        rich_rule: "{{ item }}"
        permanent: true
        immediate: true
        state: disabled
      loop: "{{ _lb_fw_remove }}"

    - name: Add expected load balancer rich rules
      ansible.posix.firewalld:
        rich_rule: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ _lb_fw_rules }}"
